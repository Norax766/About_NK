<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Launcher</title>

    <link rel="stylesheet" href="css/fortnite.css">
</head>
<body>

    <div id="desktop">

        <div id="fortnite-icon">

            <img src="images/fortnite_icon.jpeg" alt="Fortnite">

            <span>Fortnite</span>

        </div>

        <div id="taskbar">

            <div id="taskbar-center">

                <div class="task-icon">⊞</div>
                <div class="task-icon">🔍</div>
                <div class="task-icon">🌐</div>
                <div class="task-icon">📁</div>

            </div>

            <div id="clock">

                <div id="time"></div>
                <div id="date"></div>

            </div>

        </div>

    </div>

    <div id="launcher-screen" class="hidden">

    <img src="images/fortnite_screen.jpg"
         id="launcher-bg"
         alt="Fortnite">

    <div id="launcher-status">

        <img src="images/eac_logo.png"
             id="launcher-eac"
             alt="EAC">

        <span id="launcher-text">
            Inicializando juego...
        </span>

    </div>

</div>

<div id="black-screen" class="hidden"></div>

<div id="connecting-screen" class="hidden">

    <img src="images/fortnite_screen.jpg"
         id="connecting-bg"
         alt="Fortnite">

    <div id="connecting-container">

        <h1>Conectando...</h1>

        <div id="progress-bar">

            <div id="progress-fill"></div>

        </div>

    </div>

</div>

<div id="login-screen" class="hidden">

    <img src="images/fortnite_screen.jpg"
         id="login-bg"
         alt="Fortnite">

    <div id="login-user">

        <span>Iniciando sesión como:</span>

        <h2>Invitado</h2>

    </div>

    <div id="login-center">

        <h2>Iniciando sesión...</h2>

        <div id="login-progress-bar">

            <div id="login-progress-fill"></div>

        </div>

        <button id="start-button" class="hidden">
            OPRIME AQUÍ PARA EMPEZAR
        </button>

    </div>

    <div id="login-logos">

        <img src="images/u_icon.png" alt="Unreal">

        <img src="images/eg_icon.png" alt="Epic">

    </div>

</div>

    <audio id="fortnite-music" preload="auto">
    <source src="audio/FS2C7_Overw_Collab.mp3" type="audio/mpeg">
    </audio>
    <script src="js/fortnite.js"></script>

</body>
</html>
