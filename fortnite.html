<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11</title>

    <link rel="stylesheet" href="css/f_test.css">
</head>
<body>

    <div id="desktop">

        <div id="fortnite-icon">

            <img src="images/fortnite_icon.jpeg"
                 alt="Fortnite">

            <span>Fortnite</span>

        </div>

        <div id="taskbar">

            <div id="taskbar-center">

                <div class="task-icon">⊞</div>
                <div class="task-icon">🔍</div>
                <div class="task-icon">🌐</div>
                <div class="task-icon">📁</div>

            </div>

            <div id="clock">

                <div id="time">
                    00:00
                </div>

                <div id="date">
                    00/00/0000
                </div>

            </div>

        </div>

    </div>

    <script src="js/fortnite.js"></script>

</body>
</html>
