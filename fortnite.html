<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11</title>

    <link rel="stylesheet" href="css/fortnite.css">
</head>
<body>

    <div id="desktop">

        <div id="fortnite-icon">

            <img src="images/fortnite_icon.jpeg"
                 alt="Fortnite">

            <span>Fortnite</span>

        </div>

        <div id="taskbar">

            <div id="taskbar-center">

                <div class="task-icon">⊞</div>
                <div class="task-icon">🔍</div>
                <div class="task-icon">🌐</div>
                <div class="task-icon">📁</div>

            </div>

            <div id="clock">

                <div id="time">
                    00:00
                </div>

                <div id="date">
                    00/00/0000
                </div>

            </div>

        </div>

    </div>


    <div id="launcher-screen" class="hidden">

    <img src="images/fortnite_screen.jpg"
         id="launcher-bg"
         alt="Fortnite">

    <div id="launcher-status">

        <img src="images/eac_logo.png"
             id="launcher-eac"
             alt="EAC">

        <span id="launcher-text">
            Inicializando juego...
        </span>

    </div>

    </div>

    <div id="black-screen" class="hidden"></div>

    <div id="connecting-screen" class="hidden">

    <img src="images/fortnite_screen.jpg"
         id="connecting-bg"
         alt="Fortnite">
        
    <audio id="fortnite-music"
       src="audio/FS2C7_Overw_Collab.mp3">
    </audio>
        
    <div id="connecting-container">

        <h1>Conectando...</h1>

        <div id="progress-bar">

            <div id="progress-fill"></div>

        </div>

    </div>

    </div>
    
    
    <script src="js/fortnite.js"></script>

</body>
</html>
